[package]
name = "mail_windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows Mail desktop application, native UI and startup"

[[bin]]
name = "WinMail"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
mailparse.workspace = true
windows = { workspace = true, features = ["Win32_UI_Controls_RichEdit", "Win32_Graphics_Gdi"] }
mail_app.workspace = true
mail_core.workspace = true
mail_windows_platform = { workspace = true, features = ["ui"] }
windows-sys = { workspace = true, features = [
    "Win32_Globalization", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Com",
    "Win32_System_Console", "Win32_System_Memory", "Win32_System_Registry",
    "Win32_System_Environment", "Win32_System_Ole", "Win32_System_DataExchange",
    "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_UI_Controls",
] }

[lints]
workspace = true
