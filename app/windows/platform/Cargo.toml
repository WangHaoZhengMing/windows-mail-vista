[package]
name = "mail_windows_platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows operating-system services, native controls and HTML host adapters"

[lints]
workspace = true

[features]
default = []
ui = [
    "dep:mail_html", "dep:ammonia", "dep:base64", "dep:cssparser",
    "dep:html5ever", "dep:markup5ever_rcdom", "dep:url", "dep:webview2-com",
    "dep:windows-core", "dep:windows", "dep:png", "dep:sha2",
    "windows-sys/Win32_System_Threading", "windows-sys/Win32_System_LibraryLoader",
    "windows-sys/Win32_UI_Controls", "windows-sys/Win32_UI_Controls_Dialogs",
    "windows-sys/Win32_Graphics_Gdi", "windows-sys/Win32_Graphics_GdiPlus",
    "windows-sys/Win32_UI_WindowsAndMessaging", "windows-sys/Win32_UI_Input_KeyboardAndMouse",
    "windows-sys/Win32_UI_Shell", "windows-sys/Win32_UI_HiDpi",
]

[target.'cfg(windows)'.dependencies]
mail_html = { workspace = true, optional = true }
ammonia = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cssparser = { workspace = true, optional = true }
html5ever = { workspace = true, optional = true }
markup5ever_rcdom = { workspace = true, optional = true }
url = { workspace = true, optional = true }
webview2-com = { workspace = true, optional = true }
windows-core = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_Urlmon", "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices",
] }

png = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ApplicationInstallationAndServicing", "Win32_System_DataExchange"] }
